# Broker MQTT del proyecto (contenedor cea-mqtt).
# Se levanta con `node dev.js` (docker compose en ./db).

# MQTT estándar: el backend, el ESP32 y las herramientas locales se conectan aquí.
listener 1883
allow_anonymous true

# MQTT sobre WebSockets (el puerto 9001 se publica en docker-compose).
listener 9001
protocol websockets

# Persistencia de mensajes/suscripciones retenidas.
persistence true
persistence_location /mosquitto/data/

# Logs a stdout para que aparezcan en `docker logs` y en logs/mqtt.log.
log_dest stdout
connection_messages true
