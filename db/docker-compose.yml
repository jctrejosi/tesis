version: '3.8'
services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: cea-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: cea_user
      POSTGRES_PASSWORD: cea_password
      POSTGRES_DB: cea_db
    ports:
      # 5433 en el host para no chocar con otros Postgres (ej. knowledge-db en 5432)
      - "5433:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  mosquitto:
    image: eclipse-mosquitto
    container_name: cea-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"

volumes:
  timescale-data: