version: '3.8'
services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: cea-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: cea_user
      POSTGRES_PASSWORD: cea_password
      POSTGRES_DB: cea_db
    ports:
      # Puerto 5438 en el host (5433 lo ocupa el postgres local de "contabilidad",
      # y 5432/5434/5436/5437 otros proyectos docker). Container: 5432.
      - "5438:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  mosquitto:
    image: eclipse-mosquitto
    container_name: cea-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"

volumes:
  timescale-data: